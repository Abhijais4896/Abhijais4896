<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" height="100%" style="background:#0a0d12; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- CSS Styles & Animations -->
    <style>
      .card-frame {
        fill: #0d1117;
        stroke: #21262d;
        stroke-width: 1.5;
        rx: 12px;
      }
      .trophy-text {
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 1.2px;
        text-anchor: middle;
      }

      /* Animations */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }
      @keyframes dash-flow {
        to { stroke-dashoffset: -32; }
      }
      @keyframes rotate-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes orbit-loop {
        0% { transform: rotate(0deg) translateX(42px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(42px) rotate(-360deg); }
      }

      .fx-float { animation: float 3.5s ease-in-out infinite; }
      .fx-glow { animation: pulse-glow 2.5s ease-in-out infinite; }
      .fx-dash { stroke-dasharray: 6, 6; animation: dash-flow 1.5s linear infinite; }
      .fx-spin { transform-origin: center; animation: rotate-slow 10s linear infinite; }
      .fx-orbit { transform-origin: 685px 105px; animation: rotate-slow 6s linear infinite; }
    </style>

    <!-- Colors & Gradients -->
    <!-- Card 1: Green PM -->
    <linearGradient id="grad-pm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ea043"/>
      <stop offset="100%" stop-color="#0e4429"/>
    </linearGradient>

    <!-- Card 2: Purple AI -->
    <linearGradient id="grad-ai" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#3d1f75"/>
    </linearGradient>

    <!-- Card 3: Orange Discovery -->
    <linearGradient id="grad-disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0883e"/>
      <stop offset="100%" stop-color="#5f2d0e"/>
    </linearGradient>

    <!-- Card 4: Cyan GTM -->
    <linearGradient id="grad-gtm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- ==================== CARD 1: PRODUCT MANAGEMENT ==================== -->
  <g transform="translate(15, 15)">
    <rect width="250" height="210" class="card-frame"/>
    
    <!-- Outer Connected Node Circuit (Left & Right) -->
    <g stroke="#2ea043" stroke-width="1.5" opacity="0.8">
      <!-- Left Nodes -->
      <line x1="35" y1="70" x2="55" y2="105"/>
      <line x1="55" y1="105" x2="35" y2="140"/>
      <line x1="55" y1="105" x2="85" y2="105" class="fx-dash" stroke="#3fb950"/>
      <circle cx="35" cy="70" r="4" fill="#3fb950"/>
      <circle cx="55" cy="105" r="4" fill="#3fb950"/>
      <circle cx="35" cy="140" r="4" fill="#3fb950"/>

      <!-- Right Nodes -->
      <line x1="215" y1="70" x2="195" y2="105"/>
      <line x1="195" y1="105" x2="215" y2="140"/>
      <line x1="195" y1="105" x2="165" y2="105" class="fx-dash" stroke="#3fb950"/>
      <circle cx="215" cy="70" r="4" fill="#3fb950"/>
      <circle cx="195" cy="105" r="4" fill="#3fb950"/>
      <circle cx="215" cy="140" r="4" fill="#3fb950"/>
    </g>

    <!-- Floating Cup Trophy -->
    <g class="fx-float" transform="translate(125, 105)">
      <!-- Glow Backing -->
      <ellipse cx="0" cy="-5" rx="35" ry="35" fill="#2ea043" class="fx-glow" filter="blur(10px)"/>
      
      <!-- Base -->
      <path d="M -22 35 L 22 35 L 14 25 L -14 25 Z" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
      <rect x="-4" y="15" width="8" height="10" fill="url(#grad-pm)"/>

      <!-- Handles -->
      <path d="M -22 -15 C -38 -15 -32 15 -18 10" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
      <path d="M 22 -15 C 38 -15 32 15 18 10" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>

      <!-- Cup Body -->
      <path d="M -22 -25 L 22 -25 C 22 5 12 18 0 18 C -12 18 -22 5 -22 -25 Z" fill="url(#grad-pm)" stroke="#3fb950" stroke-width="1.5"/>
    </g>

    <text x="125" y="188" fill="#3fb950" class="trophy-text">PRODUCT MANAGEMENT</text>
  </g>


  <!-- ==================== CARD 2: AI PRODUCT DEVELOPMENT ==================== -->
  <g transform="translate(285, 15)">
    <rect width="250" height="210" class="card-frame"/>

    <!-- Cyber Tech Bracket Lines -->
    <path d="M 35 65 L 55 65 L 70 105 L 55 145 L 35 145" fill="none" stroke="#a371f7" stroke-width="2" opacity="0.6"/>
    <circle cx="35" cy="65" r="3" fill="#a371f7"/>
    <circle cx="35" cy="145" r="3" fill="#a371f7"/>

    <path d="M 215 65 L 195 65 L 180 105 L 195 145 L 215 145" fill="none" stroke="#a371f7" stroke-width="2" opacity="0.6"/>
    <circle cx="215" cy="65" r="3" fill="#a371f7"/>
    <circle cx="215" cy="145" r="3" fill="#a371f7"/>

    <!-- Trophy Assembly -->
    <g class="fx-float" transform="translate(125, 105)">
      <!-- Glow -->
      <ellipse cx="0" cy="-5" rx="35" ry="35" fill="#a371f7" class="fx-glow" filter="blur(12px)"/>

      <!-- Base -->
      <path d="M -22 35 L 22 35 L 14 25 L -14 25 Z" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
      <rect x="-4" y="15" width="8" height="10" fill="url(#grad-ai)"/>

      <!-- Angular Tech Handles -->
      <path d="M -22 -15 L -35 -10 L -30 10 L -18 8" fill="none" stroke="#d2a8ff" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M 22 -15 L 35 -10 L 30 10 L 18 8" fill="none" stroke="#d2a8ff" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- Cup Body -->
      <path d="M -22 -25 L 22 -25 C 22 5 12 18 0 18 C -12 18 -22 5 -22 -25 Z" fill="url(#grad-ai)" stroke="#d2a8ff" stroke-width="1.5"/>

      <!-- Microchip / AI Node Center -->
      <rect x="-9" y="-12" width="18" height="18" rx="3" fill="#0d1117" stroke="#d2a8ff" stroke-width="1.5"/>
      <text x="0" y="-1" fill="#d2a8ff" font-size="8" font-weight="900" text-anchor="middle">AI</text>
    </g>

    <text x="125" y="188" fill="#d2a8ff" class="trophy-text">AI PRODUCT DEV</text>
  </g>


  <!-- ==================== CARD 3: PRODUCT DISCOVERY ==================== -->
  <g transform="translate(555, 15)">
    <rect width="250" height="210" class="card-frame"/>

    <!-- Radar Orbit / Target Ping Effect -->
    <g transform="translate(125, 100)">
      <circle cx="0" cy="0" r="62" fill="none" stroke="#f0883e" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>
      <!-- Orbiting Satellite Point -->
      <g class="fx-spin">
        <circle cx="0" cy="-62" r="4" fill="#ffa657"/>
        <circle cx="0" cy="-62" r="8" fill="none" stroke="#ffa657" opacity="0.6"/>
      </g>
    </g>

    <!-- Trophy Assembly -->
    <g class="fx-float" transform="translate(125, 105)">
      <!-- Glow -->
      <ellipse cx="0" cy="-5" rx="35" ry="35" fill="#f0883e" class="fx-glow" filter="blur(10px)"/>

      <!-- Base -->
      <path d="M -22 35 L 22 35 L 14 25 L -14 25 Z" fill="#161b22" stroke="#ffa657" stroke-width="1.5"/>
      <rect x="-4" y="15" width="8" height="10" fill="url(#grad-disc)"/>

      <!-- Handles -->
      <path d="M -22 -15 C -38 -15 -32 15 -18 10" fill="none" stroke="#ffa657" stroke-width="3" stroke-linecap="round"/>
      <path d="M 22 -15 C 38 -15 32 15 18 10" fill="none" stroke="#ffa657" stroke-width="3" stroke-linecap="round"/>

      <!-- Cup Body -->
      <path d="M -22 -25 L 22 -25 C 22 5 12 18 0 18 C -12 18 -22 5 -22 -25 Z" fill="url(#grad-disc)" stroke="#ffa657" stroke-width="1.5"/>

      <!-- Discovery Lens / Compass Center -->
      <circle cx="0" cy="-4" r="10" fill="#0d1117" stroke="#ffa657" stroke-width="1.5"/>
      <polygon points="0,-10 3,-3 0,0 -3,-3" fill="#ff7b72"/>
      <polygon points="0,2 3,-3 0,0 -3,-3" fill="#f0883e"/>
    </g>

    <text x="125" y="188" fill="#ffa657" class="trophy-text">PRODUCT DISCOVERY</text>
  </g>


  <!-- ==================== CARD 4: GO-TO-MARKET (GTM) ==================== -->
  <g transform="translate(825, 15)">
    <rect width="250" height="210" class="card-frame"/>

    <!-- Endless Loop Infinity Track (Launch/Scale Loop) -->
    <g transform="translate(125, 95)" opacity="0.7">
      <path d="M -50 0 C -50 -30 -15 -30 0 0 C 15 30 50 30 50 0 C 50 -30 15 -30 0 0 C -15 30 -50 30 -50 0 Z" fill="none" stroke="#38bdf8" stroke-width="2" class="fx-dash"/>
      
      <!-- Stage Labels -->
      <text x="-40" y="32" fill="#78cce8" font-size="8" font-weight="800">LAUNCH</text>
      <text x="18" y="-24" fill="#38bdf8" font-size="8" font-weight="800">BUILD</text>
      <text x="22" y="32" fill="#7dda24" font-size="8" font-weight="800">SCALE</text>
    </g>

    <!-- Trophy Assembly -->
    <g class="fx-float" transform="translate(125, 105)">
      <!-- Glow -->
      <ellipse cx="0" cy="-5" rx="35" ry="35" fill="#0284c7" class="fx-glow" filter="blur(10px)"/>

      <!-- Base -->
      <path d="M -22 35 L 22 35 L 14 25 L -14 25 Z" fill="#161b22" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="-4" y="15" width="8" height="10" fill="url(#grad-gtm)"/>

      <!-- Cup Handles -->
      <path d="M -22 -15 C -38 -15 -32 15 -18 10" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <path d="M 22 -15 C 38 -15 32 15 18 10" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

      <!-- Cup Body -->
      <path d="M -22 -25 L 22 -25 C 22 5 12 18 0 18 C -12 18 -22 5 -22 -25 Z" fill="url(#grad-gtm)" stroke="#38bdf8" stroke-width="1.5"/>

      <!-- Rocket Icon Emblem -->
      <path d="M 0 -14 C 4 -10 5 -2 5 4 L -5 4 C -5 -2 -4 -10 0 -14 Z" fill="#f0f6fc"/>
      <path d="M -5 1 L -8 6 L -5 4 Z" fill="#38bdf8"/>
      <path d="M 5 1 L 8 6 L 5 4 Z" fill="#38bdf8"/>
      <polygon points="0,4 -3,9 0,7 3,9" fill="#f0883e"/>
    </g>

    <text x="125" y="188" fill="#38bdf8" class="trophy-text">GO-TO-MARKET (GTM)</text>
  </g>
</svg>
