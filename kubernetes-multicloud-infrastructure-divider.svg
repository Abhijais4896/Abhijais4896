<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset=".5" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#00d9ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <!-- subtle atmospheric glow -->
  <ellipse cx="500" cy="45" rx="360" ry="12" fill="#00d9ff" opacity=".055" filter="url(#soft)">
    <animate attributeName="opacity" values=".03;.09;.03" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- infrastructure paths -->
  <g fill="none" stroke="url(#line)" stroke-width="1.4" opacity=".6">
    <path d="M45 45 H205 L255 25 H420"/>
    <path d="M580 25 H745 L795 45 H955"/>
    <path d="M205 45 H795"/>
  </g>

  <!-- cloud endpoints -->
  <g fill="none" stroke="#00d9ff" stroke-width="1.3" opacity=".75">
    <path d="M48 45h20c0-7-5-12-12-12-2-6-7-9-13-9-8 0-14 6-14 14-5 0-9 3-9 7z"/>
    <path d="M932 45h20c0-7-5-12-12-12-2-6-7-9-13-9-8 0-14 6-14 14-5 0-9 3-9 7z"/>
  </g>

  <!-- Kubernetes center -->
  <g transform="translate(500 45)">
    <circle r="27" fill="#07111f" stroke="#7c8cff" stroke-width="1.5" opacity=".95"/>
    <circle r="22" fill="none" stroke="#00d9ff" stroke-opacity=".25"/>
    <!-- simplified Kubernetes wheel -->
    <path d="M0-15 L4-10 L12-10 L15-3 L12 2 L15 10 L8 15 L2 12 L-5 15 L-12 10 L-10 3 L-15-3 L-12-10 L-4-10Z"
          fill="none" stroke="#00d9ff" stroke-width="1.7" filter="url(#glow)"/>
    <circle r="4" fill="#00d9ff" filter="url(#glow)"/>
    <circle cx="0" cy="-12" r="2" fill="#7c8cff"/>
    <circle cx="11" cy="-4" r="2" fill="#7c8cff"/>
    <circle cx="7" cy="9" r="2" fill="#7c8cff"/>
    <circle cx="-7" cy="9" r="2" fill="#7c8cff"/>
    <circle cx="-11" cy="-4" r="2" fill="#7c8cff"/>
  </g>

  <!-- cloud provider nodes -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="9" text-anchor="middle">
    <g transform="translate(250 25)">
      <circle r="13" fill="#07111f" stroke="#00d9ff" stroke-opacity=".65"/>
      <text y="3" fill="#a8b8ca">AWS</text>
    </g>
    <g transform="translate(750 25)">
      <circle r="13" fill="#07111f" stroke="#7c8cff" stroke-opacity=".7"/>
      <text y="3" fill="#a8b8ca">AZURE</text>
    </g>
    <g transform="translate(205 45)">
      <circle r="7" fill="#07111f" stroke="#00d9ff" stroke-opacity=".7"/>
    </g>
    <g transform="translate(795 45)">
      <circle r="7" fill="#07111f" stroke="#7c8cff" stroke-opacity=".7"/>
    </g>
  </g>

  <!-- moving data packets -->
  <circle r="2.8" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M45 45 H205 L255 25 H420"/>
  </circle>
  <circle r="2.8" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="3.1s" begin="1s" repeatCount="indefinite" path="M955 45 H795 L745 25 H580"/>
  </circle>
  <circle r="2.5" fill="#00d9ff" filter="url(#glow)">
    <animateMotion dur="2.4s" begin=".7s" repeatCount="indefinite" path="M205 45 H795"/>
  </circle>

  <!-- pulsing nodes -->
  <g fill="#00d9ff" filter="url(#glow)">
    <circle cx="205" cy="45" r="3"><animate attributeName="r" values="2;5;2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="795" cy="45" r="3"><animate attributeName="r" values="2;5;2" dur="2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- animated baseline -->
  <path d="M20 67 H980" stroke="url(#line)" stroke-width="1" opacity=".18"/>
  <path d="M20 67 H150" stroke="#00d9ff" stroke-width="2" opacity=".65">
    <animate attributeName="x1" values="20;830;20" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="150;960;150" dur="5s" repeatCount="indefinite"/>
  </path>
</svg>