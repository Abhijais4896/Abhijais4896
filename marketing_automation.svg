    <rect x="1" y="1" width="168" height="3" rx="2" fill="url(#green)"/>
    <circle cx="31" cy="31" r="17" fill="#0d494d" stroke="#55f4df"/><circle cx="29" cy="29" r="8" fill="none" stroke="#a9fff1" stroke-width="2"/><path d="M20 37L27 31L31 34L39 23" fill="none" stroke="#a9fff1" stroke-width="2"/>
