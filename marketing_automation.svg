<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<title id="title">Animated Digital Marketing Workflow Automation</title>
<desc id="desc">Animated workflow connecting research, content, SEO, paid ads, social media, analytics, CRM automation, and optimization in a neon dashboard.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050816"/><stop offset=".55" stop-color="#0b1530"/><stop offset="1" stop-color="#160b35"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00eaff"/><stop offset="1" stop-color="#4263ff"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bb75ff"/><stop offset="1" stop-color="#6446ff"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe76a"/><stop offset="1" stop-color="#ff742d"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63ffd2"/><stop offset="1" stop-color="#00a88a"/></linearGradient>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00eaff"/><stop offset=".5" stop-color="#9470ff"/><stop offset="1" stop-color="#ffb94f"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#43619b" stroke-opacity=".13"/></pattern>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#67dfff"/></marker>
</defs>
<rect width="1200" height="760" rx="26" fill="url(#bg)"/>
<rect width="1200" height="760" rx="26" fill="url(#grid)"/>
<!-- Ambient light -->
<circle cx="600" cy="360" r="250" fill="#2369ff" opacity=".045"><animate attributeName="r" values="220;290;220" dur="7s" repeatCount="indefinite"/></circle>
<g fill="#58dfff">
  <circle cx="80" cy="180" r="2.5"><animate attributeName="opacity" values=".1;1;.1" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="1100" cy="200" r="3"><animate attributeName="opacity" values="1;.2;1" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="1040" cy="650" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="625" r="2.5"><animate attributeName="opacity" values="1;.1;1" dur="3.3s" repeatCount="indefinite"/></circle>
</g>
<!-- Header -->
<text x="600" y="58" fill="#f3f7ff" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="800" text-anchor="middle" letter-spacing="1">DIGITAL MARKETING AUTOMATION</text>
<text x="600" y="86" fill="#8da7d9" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle" letter-spacing="3">FROM INSIGHT TO IMPACT • ONE CONNECTED SYSTEM</text>
<rect x="70" y="112" width="1060" height="1" fill="url(#line)" opacity=".65"/>
<!-- Flow connector paths -->
<g fill="none" stroke="#3b7cc6" stroke-width="2" stroke-opacity=".75" marker-end="url(#arrow)">
  <path d="M255 205H315"/><path d="M485 205H545"/><path d="M715 205H775"/><path d="M860 258V316"/>
  <path d="M775 370H715"/><path d="M545 370H485"/><path d="M315 370H255"/>
  <path d="M170 423V475H345"/><path d="M515 530H575"/><path d="M745 530H805"/>
</g>
<!-- moving flow packets -->
<g fill="#a5f8ff" filter="url(#soft)">
  <circle r="4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M255 205H315"/></circle>
  <circle r="4"><animateMotion dur="2.5s" repeatCount="indefinite" path="M485 205H545"/></circle>
  <circle r="4"><animateMotion dur="2.1s" repeatCount="indefinite" path="M715 205H775"/></circle>
  <circle r="4"><animateMotion dur="2.6s" repeatCount="indefinite" path="M860 258V316"/></circle>
  <circle r="4"><animateMotion dur="2.2s" repeatCount="indefinite" path="M775 370H715"/></circle>
  <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite" path="M545 370H485"/></circle>
  <circle r="4"><animateMotion dur="2.1s" repeatCount="indefinite" path="M315 370H255"/></circle>
  <circle r="4"><animateMotion dur="3s" repeatCount="indefinite" path="M170 423V475H345"/></circle>
  <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite" path="M515 530H575"/></circle>
  <circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite" path="M745 530H805"/></circle>
</g>
