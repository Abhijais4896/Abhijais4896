<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
<defs>
<linearGradient id="g" x1="0%" x2="100%">
<stop offset="0%" stop-color="#00F5FF"/>
<stop offset="50%" stop-color="#7C3AED"/>
<stop offset="100%" stop-color="#00F5FF"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
</linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="900" height="260" rx="18" fill="#0d1117"/>
<rect x="15" y="15" width="870" height="230" rx="16" fill="none" stroke="url(#g)" stroke-width="2" filter="url(#glow)"/>
<rect x="-200" y="15" width="120" height="230" fill="white" opacity="0.08" transform="skewX(-20)">
<animate attributeName="x" from="-200" to="1100" dur="3s" repeatCount="indefinite"/>
</rect>
<text x="450" y="80" text-anchor="middle" fill="#00F5FF" font-size="38" font-family="monospace" filter="url(#glow)">ABHISHEK JAISWAL
<animate attributeName="opacity" values="1;0.85;1" dur="2s" repeatCount="indefinite"/>
</text>
<text x="450" y="112" text-anchor="middle" fill="#c9d1d9" font-size="20" font-family="monospace">AI ENGINEER • AGENTIC AI • AI INFRA</text>
<circle cx="190" cy="165" r="6" fill="#3fb950">
<animate attributeName="r" values="5;8;5" dur="1.5s" repeatCount="indefinite"/>
</circle>
<text x="210" y="171" fill="#3fb950" font-family="monospace" font-size="18">STATUS : ONLINE</text>
<text x="120" y="205" fill="#58a6ff" font-family="monospace" font-size="18">FOCUS</text>
<text x="220" y="205" fill="#c9d1d9" font-family="monospace" font-size="18">Building Production AI Systems</text>
<text x="120" y="232" fill="#58a6ff" font-family="monospace" font-size="18">STACK</text>
<text x="220" y="232" fill="#c9d1d9" font-family="monospace" font-size="16">Python • FastAPI • LangGraph • Docker • Kubernetes</text>
</svg>