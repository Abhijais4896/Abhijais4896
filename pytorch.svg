<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg-circle { fill: #0d1117; stroke: #30363d; stroke-width: 1.5px; }
    
    .brand-text { font: 800 8.5px 'Segoe UI', system-ui, sans-serif; text-anchor: middle; letter-spacing: 0.8px; }
    .torch-orange { fill: #ee4c2c; }
    .torch-amber { fill: #f97316; animation: textGlow 2s ease-in-out infinite alternate; }

    /* PyTorch Flame & Ring Geometry */
    .pytorch-ring { stroke: #ee4c2c; stroke-width: 3.5; fill: none; stroke-dasharray: 100; stroke-dashoffset: 15; stroke-linecap: round; }
    .pytorch-flame { fill: url(#torch-flame-grad); }
    .pytorch-dot { fill: #ee4c2c; filter: drop-shadow(0 0 4px #ee4c2c); }

    /* Tensor Node Overlay Animations */
    .tensor-line { stroke: #f97316; stroke-width: 1; fill: none; opacity: 0.4; }
    .tensor-pulse { stroke: url(#torch-grad); stroke-width: 1.2; fill: none; stroke-dasharray: 4 8; animation: flowTensor 2s linear infinite; }
    .tensor-node { fill: #ee4c2c; filter: drop-shadow(0 0 3px #f97316); animation: pulseTensor 1.8s ease-in-out infinite alternate; }

    /* Keyframe Animations */
    .core-glow { fill: url(#torch-core); animation: pulseAura 2.5s ease-in-out infinite alternate; }

    @keyframes pulseAura {
      0% { opacity: 0.35; transform: scale(0.85); }
      100% { opacity: 0.85; transform: scale(1.15); }
    }

    @keyframes flowTensor {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pulseTensor {
      0% { r: 1.5px; opacity: 0.5; }
      100% { r: 3px; opacity: 1; fill: #ff7043; }
    }

    @keyframes textGlow {
      0% { fill: #ee4c2c; filter: drop-shadow(0 0 1px #ee4c2c); }
      100% { fill: #f97316; filter: drop-shadow(0 0 4px #f97316); }
    }
  </style>

  <defs>
    <!-- PyTorch Orange Gradient -->
    <linearGradient id="torch-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ee4c2c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ffb74d" />
    </linearGradient>

    <linearGradient id="torch-flame-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7043" />
      <stop offset="100%" stop-color="#ee4c2c" />
    </linearGradient>

    <!-- Core Radial Glow -->
    <radialGradient id="torch-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ee4c2c" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Circular Dark Background -->
  <circle cx="50" cy="50" r="48" class="bg-circle" />

  <!-- Animated Glowing Core -->
  <circle cx="50" cy="40" r="24" class="core-glow" style="transform-origin: 50px 40px;" />

  <!-- Tensor Graph Background Traces -->
  <path d="M 22 40 L 35 25 M 78 40 L 65 25" class="tensor-line" />
  <path d="M 22 40 L 35 25 M 78 40 L 65 25" class="tensor-pulse" />

  <!-- Official PyTorch Flame & Unfinished Ring Logo Geometry -->
  <g transform="translate(0, -3) scale(0.9)" style="transform-origin: 50px 40px;">
    <!-- Open Arc/Ring -->
    <path d="M 50 20 A 20 20 0 1 1 36 26" class="pytorch-ring" />
    
    <!-- Torch Flame Inside Ring -->
    <path d="M 50 24 C 47 30 43 33 43 38 C 43 43 46 46 50 46 C 54 46 57 43 57 38 C 57 33 53 30 50 24 Z" class="pytorch-flame" />
    
    <!-- Top Flame Dot Point -->
    <circle cx="50" cy="20" r="2.5" class="pytorch-dot" />
  </g>

  <!-- Tensor Computational Nodes -->
  <circle cx="22" cy="40" class="tensor-node" />
  <circle cx="78" cy="40" class="tensor-node" style="animation-delay: 0.9s;" />

  <!-- Display Name Inside Circle -->
  <text x="50" y="78" class="brand-text">
    <tspan class="torch-orange">Py</tspan><tspan class="torch-amber">Torch</tspan>
  </text>
</svg>
