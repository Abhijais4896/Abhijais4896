<svg width="150" height="100" viewBox="0 0 150 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; rx: 10px; stroke: #30363d; stroke-width: 1px; }
    .label { font: 800 8px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #f0f6fc; letter-spacing: 1px; text-anchor: middle; }
    
    .trophy-body { fill: url(#trophy-grad-3); stroke: #a855f7; stroke-width: 1; filter: drop-shadow(0 0 5px rgba(168, 85, 247, 0.35)); }
    .trophy-base { fill: url(#base-grad-3); stroke: #30363d; stroke-width: 0.5; }
    
    .circuit-line { stroke: #581c87; stroke-width: 0.8; fill: none; stroke-linejoin: round; }
    .circuit-pulse { stroke: url(#pulse-grad-3); stroke-width: 1.2; fill: none; stroke-dasharray: 6 12; animation: runPulse 2s linear infinite; }
    .chip-core { fill: #1e1b4b; stroke: #c084fc; stroke-width: 1; }
    .chip-text { font: 900 4px sans-serif; fill: #c084fc; text-anchor: middle; }

    @keyframes runPulse {
      0% { stroke-dashoffset: 36; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes chipGlow {
      0%, 100% { filter: drop-shadow(0 0 2px #a855f7); }
      50% { filter: drop-shadow(0 0 6px #e879f9); }
    }
  </style>

  <defs>
    <linearGradient id="trophy-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="base-grad-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="pulse-grad-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <rect width="150" height="100" class="bg" />

  <!-- Animated Circuit Backdrop -->
  <g transform="translate(0, 5)">
    <path d="M 15 20 L 35 20 L 45 35 L 45 60 L 25 75 H 10" class="circuit-line" />
    <path d="M 135 20 L 115 20 L 105 35 L 105 60 L 125 75 H 140" class="circuit-line" />
    
    <path d="M 15 20 L 35 20 L 45 35 L 45 60 L 25 75 H 10" class="circuit-pulse" />
    <path d="M 135 20 L 115 20 L 105 35 L 105 60 L 125 75 H 140" class="circuit-pulse" />

    <circle cx="15" cy="20" r="1.5" fill="#c084fc" />
    <circle cx="135" cy="20" r="1.5" fill="#c084fc" />
    <circle cx="10" cy="75" r="1.5" fill="#c084fc" />
    <circle cx="140" cy="75" r="1.5" fill="#c084fc" />
  </g>

  <!-- Central Trophy -->
  <g transform="translate(-10, 5) scale(0.9)">
    <path d="M78 30 C70 30 70 45 80 48" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" />
    <path d="M112 30 C120 30 120 45 110 48" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" />

    <path d="M80 25 H110 L105 52 C100 60 90 60 85 52 Z" class="trophy-body" />
    
    <path d="M92 58 H98 V65 H92 Z" fill="#6b21a8" />
    <path d="M85 65 H105 L108 72 H82 Z" class="trophy-base" />

    <!-- AI Chip Core -->
    <g transform="translate(95, 38)" style="animation: chipGlow 2.5s infinite ease-in-out;">
      <rect x="-7" y="-7" width="14" height="14" rx="2" class="chip-core" />
      <text x="0" y="1.5" class="chip-text">AI</text>
      <line x1="-5" y1="-9" x2="-5" y2="-7" stroke="#c084fc" stroke-width="0.8" />
      <line x1="0" y1="-9" x2="0" y2="-7" stroke="#c084fc" stroke-width="0.8" />
      <line x1="5" y1="-9" x2="5" y2="-7" stroke="#c084fc" stroke-width="0.8" />
      <line x1="-5" y1="7" x2="-5" y2="9" stroke="#c084fc" stroke-width="0.8" />
      <line x1="0" y1="7" x2="0" y2="9" stroke="#c084fc" stroke-width="0.8" />
      <line x1="5" y1="7" x2="5" y2="9" stroke="#c084fc" stroke-width="0.8" />
    </g>
  </g>

  <text x="75" y="90" class="label">AI ENGINEERING</text>
</svg>
