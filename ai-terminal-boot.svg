
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect x="20" y="20" width="860" height="480" rx="10" fill="#161b22" stroke="#30363d"/>
  <circle cx="45" cy="42" r="6" fill="#ff5f56"/>
  <circle cx="65" cy="42" r="6" fill="#ffbd2e"/>
  <circle cx="85" cy="42" r="6" fill="#27c93f"/>
  <text x="120" y="47" fill="#8b949e" font-family="monospace" font-size="18">AI_ENGINEERING_OS v2026.08</text>

  <g font-family="monospace" font-size="20" fill="#3fb950">
    <text x="40" y="90">$ uv run main.py</text>

    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="0.5s" dur="0.1s" fill="freeze"/>
      <text x="40" y="130">✓ Loading Python Runtime...</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="1.1s" dur="0.1s" fill="freeze"/>
      <text x="40" y="165">✓ Starting FastAPI...</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="1.7s" dur="0.1s" fill="freeze"/>
      <text x="40" y="200">✓ Connecting PostgreSQL...</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="2.3s" dur="0.1s" fill="freeze"/>
      <text x="40" y="235">✓ Connecting Redis...</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="2.9s" dur="0.1s" fill="freeze"/>
      <text x="40" y="270">✓ Connecting Qdrant...</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="3.5s" dur="0.1s" fill="freeze"/>
      <text x="40" y="305">✓ Loading LangChain...</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="4.1s" dur="0.1s" fill="freeze"/>
      <text x="40" y="340">✓ Loading LangGraph...</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="4.7s" dur="0.1s" fill="freeze"/>
      <text x="40" y="375">✓ Spawning Planner • Research • Coder • Reviewer</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" to="1" begin="5.3s" dur="0.1s" fill="freeze"/>
      <text x="40" y="425">STATUS: READY FOR PRODUCTION</text>
    </g>

    <text x="40" y="465">$ <tspan>█
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </tspan></text>
  </g>
</svg>
