<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
<title id="title">3D animated cowboy emoji</title><desc id="desc">A glossy laughing cowboy face with a hat and two red toy blasters inside a circular badge.</desc>
<defs>
 <linearGradient id="rim" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#fff9e9"/><stop offset="1" stop-color="#fff"/></linearGradient>
 <linearGradient id="bg" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#fff2bd"/><stop offset=".53" stop-color="#ffd3a2"/><stop offset="1" stop-color="#ff8b42"/></linearGradient>
 <linearGradient id="hat" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#ffdf5a"/><stop offset=".4" stop-color="#b77a06"/><stop offset=".7" stop-color="#714800"/><stop offset="1" stop-color="#e3a51a"/></linearGradient>
 <linearGradient id="face" x1="0" y1="0" x2=".1" y2="1"><stop stop-color="#fff66c"/><stop offset=".7" stop-color="#ffdb35"/><stop offset="1" stop-color="#f8a91b"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2=".2" y2="1"><stop stop-color="#ffb6a8"/><stop offset=".35" stop-color="#ed4d50"/><stop offset=".7" stop-color="#b31d2f"/><stop offset="1" stop-color="#ff7762"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur in="SourceAlpha" stdDeviation="5"/><feOffset dy="7"/><feComponentTransfer><feFuncA type="linear" slope=".32"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<circle cx="160" cy="160" r="151" fill="#fff" opacity=".95"/><circle cx="160" cy="160" r="140" fill="url(#rim)"/><circle cx="160" cy="160" r="130" fill="url(#bg)"/>
<ellipse cx="160" cy="251" rx="82" ry="13" fill="#b75e2e" opacity=".2" filter="url(#glow)"/>
<g filter="url(#shadow)" class="float">
 <!-- ears and head -->
 <path d="M83 113 Q49 79 45 119 Q47 153 83 168 L105 146Z" fill="url(#hat)" stroke="#c58b14" stroke-width="3"/>
 <path d="M237 113 Q271 79 275 119 Q273 153 237 168 L215 146Z" fill="url(#hat)" stroke="#c58b14" stroke-width="3"/>
 <path d="M83 125 Q57 107 58 126 Q61 143 85 151" fill="#81510a" opacity=".65"/><path d="M237 125 Q263 107 262 126 Q259 143 235 151" fill="#81510a" opacity=".65"/>
