 <ellipse cx="160" cy="173" rx="11" ry="5" fill="#ed7b00"/><ellipse cx="160" cy="171" rx="7" ry="2" fill="#ffef9b"/>
 <path d="M117 188 Q160 199 203 188 Q201 224 160 226 Q119 224 117 188Z" fill="#651c1b" stroke="#7c211a" stroke-width="3"/>
 <path d="M124 190 Q160 198 196 190 Q192 204 160 204 Q128 204 124 190Z" fill="#fff8ed"/>
 <ellipse cx="160" cy="216" rx="22" ry="7" fill="#ff7d8c"/><path d="M142 214 Q160 207 178 214" fill="none" stroke="#ffb1b7" stroke-width="3" stroke-linecap="round"/>
 <!-- blasters -->
 <g transform="translate(77 202) rotate(-43)">
  <rect x="-14" y="-25" width="28" height="45" rx="11" fill="url(#metal)" stroke="#9c2734" stroke-width="2"/>
  <rect x="-9" y="-36" width="18" height="23" rx="7" fill="#e94b4c" stroke="#a82a37" stroke-width="2"/>
  <rect x="-6" y="-42" width="12" height="13" rx="4" fill="#ffb2a3"/>
