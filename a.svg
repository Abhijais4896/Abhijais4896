 <path d="M116 91 Q159 111 204 91 L211 104 Q160 124 109 104Z" fill="#6c4607"/>
 <path d="M69 107 Q93 77 127 96 Q160 112 194 96 Q227 77 251 107 Q221 135 160 131 Q99 135 69 107Z" fill="url(#hat)" stroke="#c18b17" stroke-width="4"/>
 <path d="M86 101 Q119 118 160 117 Q205 117 234 100" fill="none" stroke="#fff0a3" stroke-width="4" stroke-linecap="round" opacity=".7"/>
 <!-- face -->
 <path d="M104 141 Q121 120 145 133 Q160 141 175 132 Q199 120 216 143 Q230 169 220 203 Q206 235 160 237 Q114 235 100 203 Q90 169 104 141Z" fill="url(#face)"/>
