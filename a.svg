  <path d="M-5 18 L-5 37 Q0 43 5 37 L5 18" fill="#e9b54a" stroke="#80541c" stroke-width="2"/>
  <path d="M-8 23 L8 30 M-8 31 L7 37" stroke="#ffdb70" stroke-width="3"/>
  <ellipse cx="-4" cy="-26" rx="3" ry="7" fill="#fff" opacity=".6"/>
 </g>
 <g transform="translate(243 202) rotate(43)">
  <rect x="-14" y="-25" width="28" height="45" rx="11" fill="url(#metal)" stroke="#9c2734" stroke-width="2"/>
  <rect x="-9" y="-36" width="18" height="23" rx="7" fill="#e94b4c" stroke="#a82a37" stroke-width="2"/>
  <rect x="-6" y="-42" width="12" height="13" rx="4" fill="#ffb2a3"/>
  <path d="M-11 -4 H11 M-11 6 H11" stroke="#ffb0a5" stroke-width="4"/>
  <path d="M-5 18 L-5 37 Q0 43 5 37 L5 18" fill="#e9b54a" stroke="#80541c" stroke-width="2"/>
  <path d="M-8 23 L8 30 M-8 31 L7 37" stroke="#ffdb70" stroke-width="3"/>
  <ellipse cx="-4" cy="-26" rx="3" ry="7" fill="#fff" opacity=".6"/>
 </g>
</g>
<path d="M45 148 Q39 167 47 183" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7"/>
<circle cx="160" cy="160" r="139" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/>
<style>
.float{transform-box:fill-box;transform-origin:center;animation:bob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
</style>
<g class="float" opacity="0"><circle cx="160" cy="160" r="4" fill="#fff"/></g>
</svg>