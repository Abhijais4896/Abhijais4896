<svg width="150" height="100" viewBox="0 0 150 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; rx: 10px; stroke: #30363d; stroke-width: 1px; }
    .label { font: 800 8px 'Segoe UI', system-ui, -apple-system, sans-serif; fill: #f0f6fc; letter-spacing: 0.8px; text-anchor: middle; }
    .step-text { font: 700 4px 'Segoe UI', sans-serif; fill: #06b6d4; text-anchor: middle; letter-spacing: 0.5px; }
    
    .trophy-body { fill: url(#trophy-grad-4); stroke: #06b6d4; stroke-width: 1; filter: drop-shadow(0 0 5px rgba(6, 182, 212, 0.35)); }
    .trophy-base { fill: url(#base-grad-4); stroke: #30363d; stroke-width: 0.5; }
    
    .pipe-line { stroke: #155e75; stroke-width: 1; fill: none; stroke-linejoin: round; }
    .pipe-active { stroke: url(#pipeline-grad); stroke-width: 1.2; fill: none; stroke-dasharray: 4 8; animation: pipeFlow 1.8s linear infinite; }
    
    .gear { transform-origin: center; animation: spinGear 4s linear infinite; fill: none; stroke: #f97316; stroke-width: 0.8; }
    .cloud-icon { fill: #0891b2; opacity: 0.8; }

    @keyframes pipeFlow {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes spinGear {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes servePulse {
      0%, 100% { fill: #10b981; filter: drop-shadow(0 0 1px #10b981); }
      50% { fill: #34d399; filter: drop-shadow(0 0 4px #34d399); }
    }
  </style>

  <defs>
    <linearGradient id="trophy-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#0e7490" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="base-grad-4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="pipeline-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="150" height="100" class="bg" />

  <!-- MLOps Continuous Pipeline Path -->
  <g transform="translate(0, 5)">
    <!-- Base Pipeline Trace -->
    <path d="M 22 35 C 22 18, 55 18, 75 25 C 95 18, 128 18, 128 35 C 128 55, 95 55, 75 48 C 55 55, 22 55, 22 35 Z" class="pipe-line" />
    <!-- Animated Flow -->
    <path d="M 22 35 C 22 18, 55 18, 75 25 C 95 18, 128 18, 128 35 C 128 55, 95 55, 75 48 C 55 55, 22 55, 22 35 Z" class="pipe-active" />

    <!-- Pipeline Stage Labels & Icons -->
    <!-- Train (Left) -->
    <text x="22" y="65" class="step-text">TRAIN</text>
    <!-- Evaluate (Center Top) -->
    <text x="75" y="15" class="step-text" style="fill: #f97316;">EVAL</text>
    <!-- Deploy (Right) -->
    <text x="128" y="65" class="step-text" style="fill: #10b981;">DEPLOY</text>

    <!-- Serving Status Indicator -->
    <circle cx="128" cy="35" r="2" style="animation: servePulse 1.5s infinite alternate;" />
  </g>

  <!-- Central Trophy -->
  <g transform="translate(-10, 5) scale(0.9)">
    <path d="M78 30 C70 30 70 45 80 48" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" />
    <path d="M112 30 C120 30 120 45 110 48" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round" />

    <path d="M80 25 H110 L105 52 C100 60 90 60 85 52 Z" class="trophy-body" />
    
    <path d="M92 58 H98 V65 H92 Z" fill="#0891b2" />
    <path d="M85 65 H105 L108 72 H82 Z" class="trophy-base" />

    <!-- Spinning Engine Gear Symbol on Trophy Cup -->
    <g transform="translate(95, 38)">
      <circle cx="0" cy="0" r="4" class="gear" />
      <path d="M 0 -6 L 0 6 M -6 0 L 6 0 M -4 -4 L 4 4 M -4 4 L 4 -4" stroke="#f97316" stroke-width="0.8" />
      <circle cx="0" cy="0" r="1.5" fill="#0e7490" />
    </g>
  </g>

  <!-- Trophy Labels -->
  <text x="75" y="90" class="label">MLOps / LLMOps</text>
</svg>
