<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg-circle { fill: #0d1117; stroke: #30363d; stroke-width: 1.5px; }
    
    .brand-text { font: 800 8.5px 'Segoe UI', system-ui, sans-serif; text-anchor: middle; letter-spacing: 0.8px; }
    .oai-white { fill: #ffffff; }
    .oai-cyan { fill: #10a37f; animation: textGlow 2s ease-in-out infinite alternate; }

    /* OpenAI Swirl Geometry */
    .openai-swirl { stroke: #10a37f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; filter: drop-shadow(0 0 3px rgba(16, 163, 127, 0.4)); }

    /* Evaluation Graph / Metric Overlay Animations */
    .eval-pulse { stroke: url(#oai-grad); stroke-width: 1.2; fill: none; stroke-dasharray: 4 8; animation: flowEval 2s linear infinite; }
    .eval-node { fill: #10a37f; filter: drop-shadow(0 0 3px #10a37f); animation: pulseNode 1.8s ease-in-out infinite alternate; }

    /* Keyframe Animations */
    .core-glow { fill: url(#oai-core); animation: pulseAura 2.5s ease-in-out infinite alternate; }

    @keyframes pulseAura {
      0% { opacity: 0.35; transform: scale(0.85); }
      100% { opacity: 0.85; transform: scale(1.15); }
    }

    @keyframes flowEval {
      0% { stroke-dashoffset: 24; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes pulseNode {
      0% { r: 1.5px; opacity: 0.5; }
      100% { r: 3px; opacity: 1; fill: #2dd4bf; }
    }

    @keyframes textGlow {
      0% { fill: #10a37f; filter: drop-shadow(0 0 1px #10a37f); }
      100% { fill: #2dd4bf; filter: drop-shadow(0 0 4px #2dd4bf); }
    }
  </style>

  <defs>
    <!-- OpenAI Teal/Cyan Gradient -->
    <linearGradient id="oai-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#10a37f" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>

    <!-- Core Radial Glow -->
    <radialGradient id="oai-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10a37f" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Circular Dark Background -->
  <circle cx="50" cy="50" r="48" class="bg-circle" />

  <!-- Animated Glowing Core -->
  <circle cx="50" cy="40" r="24" class="core-glow" style="transform-origin: 50px 40px;" />

  <!-- Evaluation Benchmark Backdrop Curves -->
  <path d="M 20 45 Q 35 25 50 38 T 80 25" class="eval-pulse" />

  <!-- Official OpenAI Spiral Logo Geometry -->
  <g transform="translate(0, -3) scale(0.85)" style="transform-origin: 50px 40px;">
    <path d="M 50 20 C 53 20 56 22 57 24 L 50 28 L 43 24 C 44 22 47 20 50 20 Z" class="openai-swirl" />
    <path d="M 60 26 C 62 28 62 31 61 34 L 53 30 L 53 21 C 56 22 59 24 60 26 Z" class="openai-swirl" />
    <path d="M 60 38 C 59 41 56 43 53 44 L 50 35 L 58 31 C 60 33 60 36 60 38 Z" class="openai-swirl" />
    <path d="M 50 44 C 47 44 44 42 43 40 L 50 36 L 57 40 C 56 42 53 44 50 44 Z" class="openai-swirl" />
    <path d="M 40 38 C 38 36 38 33 39 30 L 47 34 L 47 43 C 44 42 41 40 40 38 Z" class="openai-swirl" />
    <path d="M 40 26 C 41 23 44 21 47 20 L 50 29 L 42 33 C 40 31 40 28 40 26 Z" class="openai-swirl" />
  </g>

  <!-- Evaluation Benchmark Metric Nodes -->
  <circle cx="20" cy="45" class="eval-node" />
  <circle cx="80" cy="25" class="eval-node" style="animation-delay: 0.9s;" />

  <!-- Display Name Inside Circle -->
  <text x="50" y="78" class="brand-text">
    <tspan class="oai-white">OAI </tspan><tspan class="oai-cyan">Evals</tspan>
  </text>
</svg>
