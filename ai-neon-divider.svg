
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="70" viewBox="0 0 1000 70">
  <defs>
    <linearGradient id="g" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#0d1117"/>

  <line x1="60" y1="35" x2="940" y2="35"
        stroke="url(#g)" stroke-width="3" filter="url(#glow)"/>

  <g fill="#58a6ff" filter="url(#glow)">
    <circle cx="60" cy="35" r="5"/>
    <circle cx="280" cy="35" r="5"/>
    <circle cx="500" cy="35" r="5"/>
    <circle cx="720" cy="35" r="5"/>
    <circle cx="940" cy="35" r="5"/>
  </g>

  <circle cx="60" cy="35" r="8" fill="#00F5FF" filter="url(#glow)">
    <animate attributeName="cx" values="60;940;60" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
