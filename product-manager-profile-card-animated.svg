<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#101b34"/>
      <stop offset="100%" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
    <style>
      .title{font:700 42px Arial,sans-serif;fill:#fff}
      .subtitle{font:500 20px Arial,sans-serif;fill:#b9c6df}
      .label{font:600 15px Arial,sans-serif;fill:#dce6fb}
      .small{font:500 13px Arial,sans-serif;fill:#93a4c5}
      .pill{font:600 14px Arial,sans-serif;fill:#dfe9ff}
    </style>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="28" fill="url(#grid)"/>
  <circle cx="1060" cy="55" r="170" fill="#4f8cff" opacity=".07"/>
  <circle cx="1090" cy="365" r="210" fill="#a855f7" opacity=".06"/>

  <!-- Animated accent line -->
  <path d="M70 74H1130" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="18 12">
    <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="2.5s" repeatCount="indefinite"/>
  </path>

  <!-- Identity -->
  <text x="70" y="125" class="small">PRODUCT • AI • TECHNOLOGY</text>
  <text x="70" y="172" class="title">Abhishek Jaiswal</text>
  <text x="70" y="207" class="subtitle">AI Product Manager • Technical Product Manager</text>
  <text x="70" y="240" class="small">Building products that solve real user problems and drive business impact.</text>

  <!-- PM capability pills -->
  <g transform="translate(70 275)">
    <rect width="155" height="38" rx="19" fill="#162544" stroke="#31558d"/>
    <text x="77" y="24" text-anchor="middle" class="pill">Product Strategy</text>
    <rect x="166" width="145" height="38" rx="19" fill="#162544" stroke="#31558d"/>
    <text x="238" y="24" text-anchor="middle" class="pill">Discovery</text>
    <rect x="322" width="148" height="38" rx="19" fill="#162544" stroke="#31558d"/>
    <text x="396" y="24" text-anchor="middle" class="pill">Roadmapping</text>
    <rect x="481" width="105" height="38" rx="19" fill="#162544" stroke="#31558d"/>
    <text x="533" y="24" text-anchor="middle" class="pill">PRDs</text>
  </g>

  <g transform="translate(70 326)">
    <rect width="145" height="38" rx="19" fill="#162544" stroke="#31558d"/>
    <text x="72" y="24" text-anchor="middle" class="pill">User Research</text>
    <rect x="156" width="155" height="38" rx="19" fill="#162544" stroke="#31558d"/>
    <text x="233" y="24" text-anchor="middle" class="pill">Product Analytics</text>
    <rect x="322" width="110" height="38" rx="19" fill="#162544" stroke="#31558d"/>
    <text x="377" y="24" text-anchor="middle" class="pill">GTM</text>
    <rect x="443" width="170" height="38" rx="19" fill="#162544" stroke="#31558d"/>
    <text x="528" y="24" text-anchor="middle" class="pill">0→1 Products</text>
  </g>

  <!-- Animated product journey -->
  <g transform="translate(760 112)">
    <rect width="365" height="250" rx="22" fill="#0b1528" stroke="#263b62"/>
    <text x="28" y="38" class="label">PRODUCT JOURNEY</text>

    <path d="M48 82H315" stroke="#314563" stroke-width="4" stroke-linecap="round"/>
    <circle cx="48" cy="82" r="9" fill="#4f8cff"/>
    <circle cx="137" cy="82" r="9" fill="#668cff"/>
    <circle cx="226" cy="82" r="9" fill="#8b6cf0"/>
    <circle cx="315" cy="82" r="9" fill="#a855f7"/>

    <g class="small">
      <text x="48" y="110" text-anchor="middle">Discover</text>
      <text x="137" y="110" text-anchor="middle">Define</text>
      <text x="226" y="110" text-anchor="middle">Build</text>
      <text x="315" y="110" text-anchor="middle">Measure</text>
    </g>

    <!-- Moving signal -->
    <circle r="5" fill="#fff" filter="url(#glow)">
      <animateMotion dur="3.5s" repeatCount="indefinite"
        path="M48 82 L137 82 L226 82 L315 82"/>
    </circle>

    <!-- Mini analytics chart -->
    <text x="28" y="151" class="small">OUTCOME / METRICS</text>
    <path d="M30 215 L85 194 L135 202 L190 169 L245 181 L315 140"
          fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="315" cy="140" r="6" fill="#a855f7">
      <animate attributeName="r" values="5;8;5" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <path d="M30 215H315" stroke="#273a5d"/>
  </g>

  <!-- AI tags -->
  <g transform="translate(760 382)">
    <text x="0" y="0" class="small">AI / TECHNICAL FOCUS</text>
    <text x="150" y="0" class="small">GenAI • LLMs • Agentic AI • AI/ML</text>
  </g>

  <!-- subtle status pulse -->
  <circle cx="1128" cy="34" r="6" fill="#55e6a5">
    <animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>