<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="55%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#050b14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5ee7ff"/>
      <stop offset="50%" stop-color="#7c8cff"/>
      <stop offset="100%" stop-color="#b16cff"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#5ee7ff" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="898" height="278" rx="23"/>
    </clipPath>
  </defs>

  <rect width="900" height="280" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="278" rx="23" fill="url(#grid)" stroke="#5ee7ff" stroke-opacity=".18"/>

  <!-- animated scan line -->
  <g clip-path="url(#cardClip)">
    <rect x="0" y="-40" width="900" height="2" fill="#5ee7ff" opacity=".18" filter="url(#softGlow)">
      <animate attributeName="y" from="-40" to="320" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- animated infrastructure network -->
  <g fill="none" stroke="url(#accent)" stroke-width="1.5" opacity=".42">
    <path d="M690 48 L770 92 L840 55 M770 92 L760 172 L835 212 M760 172 L680 214"/>
    <path d="M690 48 L680 214"/>
  </g>
  <g fill="#5ee7ff" filter="url(#glow)">
    <circle cx="690" cy="48" r="3"><animate attributeName="r" values="2;5;2" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="92" r="3"><animate attributeName="r" values="3;5;3" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="55" r="3"><animate attributeName="r" values="2;4;2" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="172" r="3"><animate attributeName="r" values="3;5;3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="835" cy="212" r="3"><animate attributeName="r" values="2;5;2" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="214" r="3"><animate attributeName="r" values="3;5;3" dur="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moving data pulse -->
  <circle r="3" fill="#ffffff" filter="url(#glow)">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M690 48 L770 92 L760 172 L835 212"/>
  </circle>

  <!-- terminal dots -->
  <rect x="52" y="54" width="9" height="9" rx="2" fill="#5ee7ff"/>
  <rect x="68" y="54" width="9" height="9" rx="2" fill="#7c8cff"/>
  <rect x="84" y="54" width="9" height="9" rx="2" fill="#b16cff"/>

  <text x="52" y="112" fill="#8fa6bd" font-family="Arial, Helvetica, sans-serif"
        font-size="14" letter-spacing="3">CLOUD • DEVOPS • PLATFORM ENGINEERING</text>

  <text x="50" y="158" fill="#ffffff" font-family="Arial, Helvetica, sans-serif"
        font-size="42" font-weight="700" letter-spacing="1">ABHISHEK JAISWAL</text>

  <text x="52" y="190" fill="#5ee7ff" font-family="Arial, Helvetica, sans-serif"
        font-size="17" font-weight="600" letter-spacing="2">CLOUD &amp; DEVOPS ENGINEER</text>

  <text x="52" y="226" fill="#a8b8ca" font-family="Arial, Helvetica, sans-serif"
        font-size="13" letter-spacing="1.2">AWS  •  AZURE  •  GCP  •  KUBERNETES  •  TERRAFORM  •  GITOPS</text>

  <text x="52" y="249" fill="#71879e" font-family="Arial, Helvetica, sans-serif"
        font-size="12" letter-spacing="1">CI/CD  •  OBSERVABILITY  •  FINOPS  •  AI INFRASTRUCTURE</text>

  <!-- animated holographic border -->
  <rect x="2" y="2" width="896" height="276" rx="22" fill="none"
        stroke="url(#accent)" stroke-width="1.5" opacity=".65">
    <animate attributeName="opacity" values=".35;.8;.35" dur="3s" repeatCount="indefinite"/>
  </rect>

  <rect x="52" y="265" width="796" height="1" fill="url(#accent)" opacity=".65"/>
</svg>