<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260">
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050b14"/><stop offset=".55" stop-color="#0a1624"/><stop offset="1" stop-color="#07101b"/></linearGradient>
<linearGradient id="a"><stop stop-color="#00f7ff"/><stop offset="1" stop-color="#7c8cff"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#00f7ff" stroke-opacity=".055"/></pattern>
</defs>
<rect width="700" height="260" rx="18" fill="url(#bg)"/><rect x="1" y="1" width="698" height="258" rx="17" fill="url(#grid)" stroke="#00f7ff" stroke-opacity=".2"/>
<rect x="25" y="22" width="650" height="32" rx="8" fill="#0b1724" stroke="#00f7ff" stroke-opacity=".16"/>
<circle cx="43" cy="38" r="5" fill="#ff5f56"/><circle cx="60" cy="38" r="5" fill="#ffbd2e"/><circle cx="77" cy="38" r="5" fill="#27c93f"/>
<text x="100" y="43" fill="#71879e" font-family="monospace" font-size="12">cloud-devops@platform:~$</text>
<g font-family="monospace" font-size="15">
<text x="40" y="82" fill="#00f7ff">$ boot --profile cloud-devops</text>
<text x="40" y="108" fill="#a8b8ca" opacity="0">[OK] Initializing Cloud Infrastructure<animate attributeName="opacity" values="0;1" dur=".5s" begin=".4s" fill="freeze"/></text>
<text x="40" y="132" fill="#a8b8ca" opacity="0">[OK] Loading Kubernetes Platform<animate attributeName="opacity" values="0;1" dur=".5s" begin="1s" fill="freeze"/></text>
<text x="40" y="156" fill="#a8b8ca" opacity="0">[OK] Starting GitOps &amp; CI/CD<animate attributeName="opacity" values="0;1" dur=".5s" begin="1.6s" fill="freeze"/></text>
<text x="40" y="180" fill="#a8b8ca" opacity="0">[OK] Enabling Observability &amp; FinOps<animate attributeName="opacity" values="0;1" dur=".5s" begin="2.2s" fill="freeze"/></text>
<text x="40" y="204" fill="#a8b8ca" opacity="0">[OK] Connecting AI Infrastructure<animate attributeName="opacity" values="0;1" dur=".5s" begin="2.8s" fill="freeze"/></text></g>
<rect x="40" y="222" width="500" height="8" rx="4" fill="#102130"/>
<rect x="40" y="222" width="0" height="8" rx="4" fill="url(#a)" filter="url(#g)"><animate attributeName="width" values="0;500" dur="3.5s" begin=".2s" fill="freeze"/></rect>
<text x="555" y="229" fill="#00f7ff" font-family="monospace" font-size="12">READY<animate attributeName="opacity" values=".35;1;.35" dur="1.2s" repeatCount="indefinite"/></text>
<rect x="40" y="238" width="9" height="15" fill="#00f7ff" filter="url(#g)"><animate attributeName="opacity" values="1;0;1" dur=".8s" repeatCount="indefinite"/></rect>
<text x="56" y="251" fill="#71879e" font-family="monospace" font-size="11">platform@cloud:~#</text>
</svg>