<svg width="650" height="380" viewBox="0 0 650 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg-card { fill: #0d1117; stroke: #30363d; stroke-width: 2px; rx: 16px; }
    .title-text { font: 800 22px 'Segoe UI', Roboto, sans-serif; fill: #ffffff; }
    .subtitle-text { font: 600 13px 'Segoe UI', Roboto, sans-serif; fill: #20beff; letter-spacing: 1.5px; }
    .label-text { font: 600 13px 'Segoe UI', Roboto, sans-serif; fill: #94a3b8; }
    .val-text { font: 700 14px 'Segoe UI', Roboto, sans-serif; fill: #38ef7d; }
    
    .avatar-frame { stroke: url(#cyan-purple); stroke-width: 3px; fill: none; animation: spinFrame 12s linear infinite; transform-origin: 65px 65px; }
    .scan-line { stroke: url(#laser-grad); stroke-width: 2px; opacity: 0.7; animation: scan 3s ease-in-out infinite alternate; }
    
    .bar-bg { fill: #161e2e; rx: 5px; }
    .bar-fill { rx: 5px; animation: growBar 2.5s cubic-bezier(0.1, 1, 0.1, 1) forwards; }
    
    .grid-dot { rx: 2px; }
    .dot-off { fill: #1e293b; }
    .dot-low { fill: #0e7490; animation: pulseGlow 2s ease-in-out infinite alternate; }
    .dot-mid { fill: #06b6d4; animation: pulseGlow 1.5s ease-in-out infinite alternate; }
    .dot-high { fill: #00f2fe; filter: drop-shadow(0 0 4px #00f2fe); animation: pulseGlow 1s ease-in-out infinite alternate; }
    
    @keyframes growBar { from { width: 0; } }
    @keyframes spinFrame { 100% { transform: rotate(360deg); } }
    @keyframes scan { 0% { transform: translateY(0px); } 100% { transform: translateY(350px); } }
    @keyframes pulseGlow { 0% { opacity: 0.3; } 100% { opacity: 1; } }
  </style>

  <defs>
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20beff" />
      <stop offset="100%" stop-color="#8a2be2" />
    </linearGradient>
    
    <linearGradient id="green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>

    <linearGradient id="laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20beff" stop-opacity="0" />
      <stop offset="50%" stop-color="#20beff" stop-opacity="1" />
      <stop offset="100%" stop-color="#20beff" stop-opacity="0" />
    </linearGradient>

    <clipPath id="avatar-clip">
      <circle cx="65" cy="65" r="40" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="650" height="380" class="bg-card" />
  <line x1="10" y1="15" x2="640" y2="15" class="scan-line" />

  <!-- Animated Outer Circles -->
  <circle cx="65" cy="65" r="45" fill="none" stroke="#20beff" stroke-width="1.5">
    <animate attributeName="r" values="42;52;42" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="65" cy="65" r="44" class="avatar-frame" stroke-dasharray="12 18 24 12" />

  <!-- Kaggle Logo inside Circle -->
  <g clip-path="url(#avatar-clip)">
    <circle cx="65" cy="65" r="40" fill="#161b22" />
    <!-- Vector Kaggle 'K' -->
    <path d="M51 40 C51 38.34 52.34 37 54 37 C55.66 37 57 38.34 57 40 L57 90 C57 91.66 55.66 93 54 93 C52.34 93 51 91.66 51 90 Z" fill="#20beff"/>
    <path d="M78.5 41.5 C79.7 40.3 81.6 40.3 82.8 41.5 C84 42.7 84 44.6 82.8 45.8 L64 64.6 L83.5 84.1 C84.7 85.3 84.7 87.2 83.5 88.4 C82.3 89.6 80.4 89.6 79.2 88.4 L58 67.2 C56.8 66 56.8 64.1 58 62.9 Z" fill="#20beff"/>
  </g>

  <!-- Profile Details -->
  <text x="125" y="58" class="title-text">Abhishek Jaiswal</text>
  <text x="125" y="78" class="subtitle-text">AI ENGINEER • KAGGLE PROFILE</text>

  <line x1="30" y1="125" x2="620" y2="125" stroke="#1f293d" stroke-width="1" />

  <!-- Metrics Bars -->
  <g transform="translate(30, 140)">
    <text x="0" y="20" class="label-text">Competitions (5)</text>
    <rect x="0" y="28" width="260" height="10" class="bar-bg" />
    <rect x="0" y="28" width="70" height="10" fill="url(#cyan-purple)" class="bar-fill" />
    <text x="270" y="38" class="val-text">5 Active</text>

    <text x="0" y="65" class="label-text">Datasets (12)</text>
    <rect x="0" y="73" width="260" height="10" class="bar-bg" />
    <rect x="0" y="73" width="140" height="10" fill="url(#green-grad)" class="bar-fill" />
    <text x="270" y="83" class="val-text">12 Created</text>

    <text x="0" y="110" class="label-text">Code Notebooks (15)</text>
    <rect x="0" y="118" width="260" height="10" class="bar-bg" />
    <rect x="0" y="118" width="170" height="10" fill="url(#cyan-purple)" class="bar-fill" />
    <text x="270" y="128" class="val-text">15 Scripts</text>

    <text x="0" y="155" class="label-text">Discussions (91)</text>
    <rect x="0" y="163" width="260" height="10" class="bar-bg" />
    <rect x="0" y="163" width="240" height="10" fill="url(#green-grad)" class="bar-fill" />
    <text x="270" y="173" class="val-text">91 Posts</text>
  </g>

  <!-- Activity Graph -->
  <g transform="translate(380, 140)">
    <text x="0" y="20" class="label-text">Public Activity Grid</text>
    <g transform="translate(0, 35)">
      <rect x="0" y="0" width="10" height="10" class="grid-dot dot-high" />
      <rect x="0" y="14" width="10" height="10" class="grid-dot dot-mid" />
      <rect x="0" y="28" width="10" height="10" class="grid-dot dot-high" />
      <rect x="0" y="42" width="10" height="10" class="grid-dot dot-low" />
      <rect x="0" y="56" width="10" height="10" class="grid-dot dot-mid" />
      
      <rect x="14" y="0" width="10" height="10" class="grid-dot dot-low" />
      <rect x="14" y="14" width="10" height="10" class="grid-dot dot-high" />
      <rect x="14" y="28" width="10" height="10" class="grid-dot dot-off" />
      <rect x="14" y="42" width="10" height="10" class="grid-dot dot-mid" />
      <rect x="14" y="56" width="10" height="10" class="grid-dot dot-high" />

      <rect x="28" y="0" width="10" height="10" class="grid-dot dot-mid" />
      <rect x="28" y="14" width="10" height="10" class="grid-dot dot-mid" />
      <rect x="28" y="28" width="10" height="10" class="grid-dot dot-high" />
      <rect x="28" y="42" width="10" height="10" class="grid-dot dot-high" />
      <rect x="28" y="56" width="10" height="10" class="grid-dot dot-off" />

      <rect x="42" y="0" width="10" height="10" class="grid-dot dot-high" />
      <rect x="42" y="14" width="10" height="10" class="grid-dot dot-low" />
      <rect x="42" y="28" width="10" height="10" class="grid-dot dot-mid" />
      <rect x="42" y="42" width="10" height="10" class="grid-dot dot-off" />
      <rect x="42" y="56" width="10" height="10" class="grid-dot dot-high" />

      <rect x="56" y="0" width="10" height="10" class="grid-dot dot-off" />
      <rect x="56" y="14" width="10" height="10" class="grid-dot dot-high" />
      <rect x="56" y="28" width="10" height="10" class="grid-dot dot-high" />
      <rect x="56" y="42" width="10" height="10" class="grid-dot dot-mid" />
      <rect x="56" y="56" width="10" height="10" class="grid-dot dot-mid" />

      <rect x="70" y="0" width="10" height="10" class="grid-dot dot-high" />
      <rect x="70" y="14" width="10" height="10" class="grid-dot dot-mid" />
      <rect x="70" y="28" width="10" height="10" class="grid-dot dot-low" />
      <rect x="70" y="42" width="10" height="10" class="grid-dot dot-high" />
      <rect x="70" y="56" width="10" height="10" class="grid-dot dot-high" />
    </g>

    <path d="M 0 140 Q 30 110 60 130 T 120 100 T 180 125 T 230 80" fill="none" stroke="#20beff" stroke-width="2.5" />
    <circle cx="230" cy="80" r="4" fill="#38ef7d">
      <animate attributeName="r" values="3;6;3" dur="1s" repeatCount="indefinite" />
    </circle>
  </g>

  <text x="30" y="355" class="subtitle-text" font-size="11">ACTIVE CONTRIBUTOR • 9 FOLLOWERS • 1 MODEL</text>
  <text x="460" y="355" class="label-text" font-size="11">GitHub Profile Card</text>
</svg>
