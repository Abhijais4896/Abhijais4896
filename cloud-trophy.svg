<svg xmlns="http://www.w3.org/2000/svg" width="180" height="150" viewBox="0 0 180 150">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00f7ff"/>
    <stop offset="50%" stop-color="#7c8cff"/>
    <stop offset="100%" stop-color="#b56cff"/>
  </linearGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
</defs>

<!-- atmospheric glow -->
<ellipse cx="90" cy="132" rx="54" ry="7" fill="#00f7ff" opacity=".09" filter="url(#soft)">
  <animate attributeName="rx" values="45;62;45" dur="2.8s" begin="0.0s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".04;.14;.04" dur="2.8s" begin="0.0s" repeatCount="indefinite"/>
</ellipse>

<!-- floating trophy card -->
<g>
  <animateTransform attributeName="transform" type="translate"
    values="0 0;0 -4;0 0" dur="2.8s" begin="0.0s" repeatCount="indefinite"/>

  <rect x="18" y="10" width="144" height="118" rx="18"
        fill="#07111f" stroke="url(#g)" stroke-opacity=".45"/>

  <!-- animated border -->
  <rect x="19.5" y="11.5" width="141" height="115" rx="17"
        fill="none" stroke="#00f7ff" stroke-opacity=".3">
    <animate attributeName="stroke-opacity" values=".15;.7;.15" dur="2.2s" begin="0.0s" repeatCount="indefinite"/>
  </rect>

  <!-- trophy -->
  <g transform="translate(90 65)" fill="none" stroke="url(#g)" stroke-width="3" filter="url(#glow)">
    <path d="M-18-25 H18 V-9 C18 8 9 17 0 17 C-9 17-18 8-18-9 Z"/>
    <path d="M-18-20 H-31 C-31-2-24 6-16 7"/>
    <path d="M18-20 H31 C31-2 24 6 16 7"/>
    <path d="M0 17 V29"/>
    <path d="M-14 29 H14"/>
  </g>

  <!-- trophy icon -->
  <text x="90" y="58" text-anchor="middle" font-family="Arial, sans-serif"
        font-size="13" font-weight="700" fill="#ffffff" opacity=".9">
    ☁
  </text>

  <!-- stars -->
  <g fill="#00f7ff" filter="url(#glow)">
    <circle cx="45" cy="30" r="1.8"><animate attributeName="opacity" values=".2;1;.2" dur="1.7s" begin="0.0s" repeatCount="indefinite"/></circle>
    <circle cx="136" cy="31" r="1.8"><animate attributeName="opacity" values="1;.2;1" dur="1.9s" begin="0.0s" repeatCount="indefinite"/></circle>
    <circle cx="39" cy="91" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" begin="0.0s" repeatCount="indefinite"/></circle>
    <circle cx="142" cy="91" r="1.4"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" begin="0.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- shine sweep -->
  <rect x="31" y="18" width="4" height="100" rx="2" fill="#ffffff" opacity="0">
    <animate attributeName="x" values="31;145;31" dur="3.6s" begin="0.0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.22;0" dur="3.6s" begin="0.0s" repeatCount="indefinite"/>
  </rect>
</g>

<!-- label -->
<text x="90" y="144" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
      font-size="10" font-weight="700" letter-spacing="1.7" fill="#9fb2c7">CLOUD</text>
</svg>