<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900" role="img" aria-labelledby="title desc">
  <title id="title">DM Community animated logo</title>
  <desc id="desc">A neon blue and gold DM monogram surrounded by animated community, idea, analytics, document, and network symbols.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#030817"/><stop offset=".55" stop-color="#07132f"/><stop offset="1" stop-color="#190b3e"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00f5ff"/><stop offset=".48" stop-color="#087cff"/><stop offset="1" stop-color="#1939ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff86a"/><stop offset=".48" stop-color="#ffad28"/><stop offset="1" stop-color="#ff4d23"/>
    </linearGradient>
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00eaff"/><stop offset=".52" stop-color="#4c6fff"/><stop offset="1" stop-color="#ffb52e"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#31538b" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="900" height="900" rx="44" fill="url(#bg)"/>
  <rect width="900" height="900" rx="44" fill="url(#grid)"/>
  <circle cx="450" cy="390" r="280" fill="#087cff" opacity=".06">
    <animate attributeName="r" values="250;285;250" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".03;.09;.03" dur="5s" repeatCount="indefinite"/>
  </circle>
  <g fill="#35cfff" opacity=".8">
    <circle cx="126" cy="220" r="3"><animate attributeName="opacity" values=".15;1;.15" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="195" r="4"><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="145" cy="590" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="770" cy="590" r="3"><animate attributeName="opacity" values="1;.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="292" cy="110" r="2.5"><animate attributeName="opacity" values=".1;1;.1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="630" cy="115" r="2.5"><animate attributeName="opacity" values="1;.1;1" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <!-- Orbit and moving energy pulse -->
  <ellipse cx="450" cy="375" rx="302" ry="235" fill="none" stroke="url(#underline)" stroke-width="3" stroke-opacity=".8" stroke-dasharray="9 12">
    <animate attributeName="stroke-dashoffset" values="0;84" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  <circle r="7" fill="#46f7ff" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite" path="M148 375 A302 235 0 1 1 752 375 A302 235 0 1 1 148 375"/>
  </circle>
  <!-- Orbit badges -->
  <g filter="url(#softGlow)" stroke-width="3" fill="#071a3c">
    <g transform="translate(174 270)" stroke="#00eaff">
      <circle r="39"/><g fill="#eafcff" stroke="none">
        <circle cx="-11" cy="-8" r="7"/><circle cx="9" cy="-12" r="8"/><circle cx="22" cy="-3" r="6"/>
        <path d="M-25 15Q-23 -1 -11 1Q1 2 2 17V21H-25Z"/><path d="M0 14Q1 -5 12 -4Q28 -3 28 15V20H0Z"/>
      </g>
    </g>
    <g transform="translate(450 155)" stroke="#228bff">
      <circle r="39"/><path d="M-13 -3a13 13 0 1 1 26 0c0 8-6 9-6 17H-7c0-8-6-9-6-17Z" fill="none" stroke="#e9f8ff"/>
      <path d="M-7 20H7M-5 25H5" stroke="#e9f8ff"/>
    </g>
    <g transform="translate(724 270)" stroke="#ff8b36">
      <circle r="39"/><rect x="-15" y="-19" width="30" height="38" rx="3" fill="none" stroke="#fff3df"/>
      <path d="M-8 -9H8M-8 0H8M-8 9H8" stroke="#fff3df"/>
    </g>
    <g transform="translate(752 485)" stroke="#a45aff">
      <circle r="39"/><g stroke="#f5eaff" fill="#f5eaff"><path d="M0 -12L-14 12H14Z" fill="none"/><circle cy="-14" r="5"/><circle cx="-15" cy="13" r="5"/><circle cx="15" cy="13" r="5"/></g>
    </g>
    <g transform="translate(146 485)" stroke="#168cff">
      <circle r="39"/><g fill="#48e9ff" stroke="none"><rect x="-19" y="5" width="10" height="17" rx="2"/><rect x="-4" y="-7" width="10" height="29" rx="2"/><rect x="11" y="-19" width="10" height="41" rx="2"/></g>
    </g>
  </g>
  <!-- Main monogram -->
  <g transform="translate(0 8)">
    <path d="M245 300H365C470 300 526 365 526 455S465 610 365 610H245Z M302 355V555H360C423 555 464 514 464 455S423 355 360 355Z" fill="url(#blue)" fill-rule="evenodd" stroke="#45eaff" stroke-width="2" filter="url(#glow)">
      <animate attributeName="opacity" values=".9;1;.9" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M390 300H468L535 397L602 300H680L567 465L602 515L680 610H601L535 535L468 610H390L496 465Z" fill="url(#gold)" stroke="#ffe88b" stroke-width="2" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.86;1" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <!-- upward arrow -->
    <path d="M520 552L680 335L650 326L716 292L709 363L690 343L548 570Z" fill="url(#gold)" stroke="#fff58a" stroke-width="2" filter="url(#softGlow)">
      <animateTransform attributeName="transform" type="translate" values="0 4;0 -5;0 4" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- Title -->
  <g text-anchor="middle" font-family="Inter, Montserrat, Arial, sans-serif" font-weight="800">
    <text x="450" y="715" font-size="68" fill="#f7fbff" letter-spacing="1">DM Community</text>
    <text x="450" y="715" font-size="68" fill="none" stroke="#9fdfff" stroke-opacity=".28" stroke-width="1">DM Community</text>
    <rect x="260" y="744" width="380" height="5" rx="3" fill="url(#underline)" filter="url(#glow)">
      <animate attributeName="width" values="180;380;180" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="350;260;350" dur="4s" repeatCount="indefinite"/>
    </rect>
    <text x="450" y="790" font-size="15" fill="#8ea8d5" letter-spacing="5" font-weight="500">LEARN  •  SHARE  •  GROW</text>
  </g>
</svg>